<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CRUD Fly</title>
    <style>
      html, body { margin: 0; height: 100%; background: #193e35; color: #f8edc5; font-family: ui-monospace, Menlo, monospace; }
      #app { display: grid; grid-template-columns: 1fr 320px; height: 100%; }
      #stage { position: relative; }
      #stage canvas { display: block; width: 100%; height: 100%; }
      #hud { padding: 16px; overflow: auto; background: #0f2a24; }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="stage"></div>
      <aside id="hud"></aside>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
