<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CRUD Fly</title>
    <style>
      html, body { margin: 0; height: 100%; background: #193e35; color: #f8edc5; font-family: ui-monospace, Menlo, monospace; }
      #app { display: grid; grid-template-columns: 1fr 320px; height: 100%; }
      #stage { position: relative; min-width: 0; overflow: hidden; }
      #stage canvas { display: block; width: 100%; height: 100%; }
      #hud { padding: 16px; overflow: auto; background: #0f2a24; font-size: 13px; }
      #hud h1 { font-size: 12px; letter-spacing: .12em; color: #d9fd66; margin: 0 0 12px; }
      #hud h2 { font-size: 14px; margin: 16px 0 8px; color: #f8edc5; }
      #hud .big { font-size: 34px; line-height: 1.1; color: #fff; }
      #hud .big small { font-size: 11px; letter-spacing: .1em; color: #87c9b1; margin-left: 6px; }
      #hud ul { list-style: none; padding: 0; margin: 8px 0; color: #f34684; }
      #hud li { margin: 2px 0; }
      #hud .fine { color: #87c9b1; font-size: 11px; line-height: 1.4; margin-top: 24px; }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="stage"></div>
      <aside id="hud"></aside>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
